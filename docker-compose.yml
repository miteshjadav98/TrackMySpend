# Local development stack.
#   docker compose up -d                 -> Postgres + Redis only (run API and web natively)
#   docker compose --profile app up -d   -> also builds and runs the API and web app
name: moneymoney

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: moneymoney
      POSTGRES_PASSWORD: moneymoney
      POSTGRES_DB: moneymoney
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/local/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneymoney -d moneymoney"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    # Matches Memorystore for Redis 7.x semantics.
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://moneymoney:moneymoney@postgres:5432/moneymoney
      REDIS_URL: redis://redis:6379/0
      COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_ORIGIN: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
