# Weekly update PRs. CI pins actions to commit SHAs, so Dependabot is what keeps them current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm-minor:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule: { interval: weekly }
