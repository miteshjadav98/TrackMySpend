[project]
name = "finance-api"
version = "0.1.0"
description = "FastAPI service for the MoneyMoney personal finance assistant."
requires-python = ">=3.12"
dependencies = [
  "finance-core",
  "fastapi>=0.120",
  "uvicorn[standard]>=0.38",
]

[project.scripts]
finance-api = "finance_api.serve:main"

[tool.uv.sources]
finance-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
